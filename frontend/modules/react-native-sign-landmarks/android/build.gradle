// MediaPipe Holistic on the phone as a VisionCamera output (HANDOFF.md §49).
// Built like VisionCamera's own barcode-scanner plugin (a Nitro module).
buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/SignLandmarks+autolinking.gradle"
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["SignLandmarks_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SignLandmarks_" + name]).toInteger()
}

// MediaPipe's Holistic model (13 MB), fetched once at build time instead of
// kept in git. Same file as ai/models/mediapipe/ (ai/scripts/compare_holistic.py).
def holisticModel = file("src/main/assets/holistic_landmarker.task")
def holisticModelUrl = "https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/latest/holistic_landmarker.task"
tasks.register("downloadHolisticModel") {
  outputs.file(holisticModel)
  doLast {
    if (!holisticModel.exists()) {
      holisticModel.parentFile.mkdirs()
      new URL(holisticModelUrl).withInputStream { input -> holisticModel.withOutputStream { it << input } }
    }
  }
}
preBuild.dependsOn("downloadHolisticModel")

android {
  namespace "com.margelo.nitro.signlandmarks"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  // The model must stay uncompressed so MediaPipe can map it.
  aaptOptions {
    noCompress "task", "tflite"
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-native:+"

  // CameraX ImageAnalysis (the same version VisionCamera 5.2.3 uses).
  def camerax_version = "1.7.0-alpha03"
  implementation "androidx.camera:camera-core:${camerax_version}"

  // MediaPipe Tasks: HolisticLandmarker.
  implementation "com.google.mediapipe:tasks-vision:0.10.35"

  implementation project(":react-native-nitro-modules")
  implementation project(":react-native-vision-camera")
}
